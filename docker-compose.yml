# Acesso Católico — portal público e painel admin (Nuxt 4).
#
# Padrão da VPS (espelho em ../../../vps): os apps entram na rede externa `caddy_net`
# com container_names fixos, e o Caddy faz reverse_proxy:
#   - acessocatolico.com.br       -> acessocatolico_app:3000
#   - admin.acessocatolico.com.br -> acessocatolico_admin:3000
#
# O banco NÃO sobe aqui: a lojinha usa o Postgres GLOBAL da VPS (container
# `global_psql`, em infra/dbs/global_psql, na rede caddy_net). A conexão vem por
# `DATABASE_URL` (ver .env.example); o database `acessocatolico` é criado pelo
# init do próprio global_psql.
#
# Subir tudo de uma vez:  ./up.sh

services:
  migrate:
    build:
      context: .
      dockerfile: db/Dockerfile
    image: acessocatolico_migrate
    container_name: acessocatolico_migrate
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    networks:
      - caddy_net

  app:
    build:
      context: .
      dockerfile: portal/Dockerfile
    image: acessocatolico_app
    container_name: acessocatolico_app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Guarda de memória (defesa em profundidade — ver incidente 2026-09-10 no
    # JOURNAL da VPS). Operação saudável usa ~80MB (pico ~250MB sob carga). O
    # teto default do heap do V8 (~2GB) deixava um vazamento inflar por minutos
    # em GC thrashing antes de morrer. Capamos o old space bem abaixo disso, e o
    # mem_limit do container fica um pouco acima do heap + overhead (não-heap,
    # better-sqlite3, buffers): um vazamento futuro reinicia rápido em vez de
    # travar. `restart: unless-stopped` religa o container após o OOM.
    mem_limit: 768m
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      # Capa o heap do V8 (old space) em 512MB — folga confortável sobre o uso
      # normal, mas força um OOM rápido (e restart) num vazamento, em vez do
      # thrashing prolongado perto do teto default de ~2GB.
      NODE_OPTIONS: --max-old-space-size=512
      # String de conexão do Prisma → Postgres global
      DATABASE_URL: ${DATABASE_URL:-}
    # Probe de readiness: bate em /api/health (rota barata, sem banco). Node 24
    # traz `fetch` global, então não precisa de curl/wget na imagem slim. O
    # start_period cobre o boot do Nitro antes de contar falhas.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - caddy_net

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    image: acessocatolico_admin
    container_name: acessocatolico_admin
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Guarda de memória (defesa em profundidade — espelha o container do portal).
    mem_limit: 768m
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NODE_OPTIONS: --max-old-space-size=512
      DATABASE_URL: ${DATABASE_URL:-}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-}
      # Destino do botão "Ir ao site" do painel (portal público).
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://acessocatolico.com.br}
    # Probe de readiness (espelha o portal): /api/health não exige sessão.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - caddy_net

networks:
  # Rede compartilhada onde vivem o Caddy e o Postgres global (criada fora deste compose).
  caddy_net:
    external: true
