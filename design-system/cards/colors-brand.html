<!-- @dsCard group="Cores" viewport="700x210" name="Cores de marca" subtitle="Violeta litúrgico (primária) + âmbar de vela (acento)" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-page);font-family:var(--font-sans);padding:var(--space-6);
    display:grid;grid-template-columns:repeat(6,1fr);gap:var(--space-3)}
  .sw{border-radius:var(--radius-md);padding:var(--space-3);min-height:96px;display:flex;
    flex-direction:column;justify-content:flex-end;border:1px solid rgba(0,0,0,.04)}
  .name{font-size:var(--text-xs);font-weight:var(--weight-semibold)}
  .val{font-family:var(--font-mono);font-size:10px;opacity:.8;margin-top:2px}
  .dark{color:#fff}.light{color:var(--ink-900)}
</style>
</head>
<body>
  <div class="sw dark" style="background:var(--violet-800)"><span class="name">violet-800</span><span class="val">--brand-strong</span></div>
  <div class="sw dark" style="background:var(--violet-700)"><span class="name">violet-700</span><span class="val">--brand</span></div>
  <div class="sw dark" style="background:var(--violet-600)"><span class="name">violet-600</span><span class="val">--brand-hover</span></div>
  <div class="sw light" style="background:var(--violet-200)"><span class="name">violet-200</span><span class="val">tint</span></div>
  <div class="sw light" style="background:var(--violet-100)"><span class="name">violet-100</span><span class="val">--brand-tint</span></div>
  <div class="sw light" style="background:var(--violet-50)"><span class="name">violet-50</span><span class="val">quiet</span></div>

  <div class="sw light" style="background:var(--amber-700)"><span class="name">amber-700</span><span class="val">&nbsp;</span></div>
  <div class="sw light" style="background:var(--amber-600)"><span class="name">amber-600</span><span class="val">--accent-strong</span></div>
  <div class="sw light" style="background:var(--amber-500)"><span class="name">amber-500</span><span class="val">--accent</span></div>
  <div class="sw light" style="background:var(--amber-200)"><span class="name">amber-200</span><span class="val">&nbsp;</span></div>
  <div class="sw light" style="background:var(--amber-100)"><span class="name">amber-100</span><span class="val">--accent-tint</span></div>
  <div class="sw light" style="background:var(--amber-50)"><span class="name">amber-50</span><span class="val">&nbsp;</span></div>
</body>
</html>
