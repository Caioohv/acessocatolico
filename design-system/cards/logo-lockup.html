<!-- @dsCard group="Marca" viewport="700x280" name="Logo — assinatura" subtitle="Marca (cruz + acesso) e wordmark em Spectral" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-page);font-family:var(--font-sans);color:var(--text-strong);
    padding:var(--space-8);display:flex;flex-direction:column;gap:var(--space-8)}
  .row{display:flex;align-items:center;gap:var(--space-8);flex-wrap:wrap}
  .lockup{display:flex;align-items:center;gap:var(--space-4)}
  .lockup img{width:52px;height:52px;display:block}
  .word{font-family:var(--font-display);line-height:1;letter-spacing:var(--tracking-tight)}
  .word b{display:block;font-weight:var(--weight-semibold);font-size:1.7rem;color:var(--text-strong)}
  .word span{display:block;font-weight:var(--weight-medium);font-size:1.7rem;color:var(--brand)}
  .onbrand{background:var(--surface-brand);border-radius:var(--radius-lg);padding:var(--space-5) var(--space-6)}
  .onbrand .word b{color:var(--paper-50)}
  .onbrand .word span{color:var(--amber-500)}
  .mono{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-muted);letter-spacing:var(--tracking-mono)}
</style>
</head>
<body>
  <div class="row">
    <div class="lockup">
      <img src="../assets/logo-mark.svg" alt="">
      <span class="word"><b>Acesso</b><span>Católico</span></span>
    </div>
    <div class="onbrand">
      <span class="lockup" style="gap:var(--space-4)">
        <img src="../assets/logo-mark.svg" alt="">
        <span class="word"><b>Acesso</b><span>Católico</span></span>
      </span>
    </div>
  </div>
  <div class="mono">assets/logo-mark.svg &nbsp;·&nbsp; margem de proteção = altura da cruz &nbsp;·&nbsp; nunca distorça ou recolora o âmbar</div>
</body>
</html>
