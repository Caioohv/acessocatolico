<!-- @dsCard group="Marca" viewport="700x220" name="Frescor do dado — atualizado_em" subtitle="Elemento-assinatura: confiança pela transparência do dado" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-page);font-family:var(--font-sans);color:var(--text-body);
    padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-4)}
  .lead{font-family:var(--font-display);font-size:1.05rem;color:var(--text-strong);max-width:60ch}
  .stamps{display:flex;gap:var(--space-6);flex-wrap:wrap}
  .stamp{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);
    font-size:var(--text-meta);letter-spacing:var(--tracking-mono);color:var(--text-muted)}
  .dot{width:9px;height:9px;border-radius:var(--radius-pill);flex:none}
  .report{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
    font-size:var(--text-sm);font-weight:var(--weight-semibold);color:var(--text-link);
    border:1px solid var(--border);background:var(--surface-card);border-radius:var(--radius-pill);
    padding:6px var(--space-3)}
</style>
</head>
<body>
  <p class="lead">“Missa errada é pior que missa ausente.” O frescor do dado é parte da identidade.</p>
  <div class="stamps">
    <span class="stamp"><span class="dot" style="background:var(--fresh)"></span>atualizado há 2 dias</span>
    <span class="stamp"><span class="dot" style="background:var(--stale)"></span>atualizado há 3 meses</span>
    <span class="stamp"><span class="dot" style="background:var(--old)"></span>atualizado há 1 ano</span>
  </div>
  <a class="report">⚑ Reportar erro nesta informação</a>
</body>
</html>
