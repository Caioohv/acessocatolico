<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-page);padding:var(--space-6);font-family:var(--font-display);
    color:var(--text-strong);display:flex;flex-direction:column;gap:var(--space-2)}
  .d{font-size:2.6rem;line-height:var(--leading-tight);letter-spacing:var(--tracking-tight);font-weight:600}
  .h{font-size:1.5rem;line-height:var(--leading-snug);font-weight:500}
  .q{font-size:1.15rem;font-style:italic;color:var(--brand);font-weight:400}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:var(--space-2)}
</style>
</head>
<body>
  <div class="d">A sua fé, perto de você</div>
  <div class="h">Missas, confissões e eventos na sua cidade</div>
  <div class="q">“Vinde a mim, todos os que estais cansados”</div>
  <div class="meta">Spectral · 600 / 500 / 400 italic · --font-display</div>
</body>
</html>
