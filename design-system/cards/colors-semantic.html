<!-- @dsCard group="Cores" viewport="700x170" name="Cores semânticas" subtitle="Sucesso, atenção, erro e informação" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-page);font-family:var(--font-sans);padding:var(--space-6);
    display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4)}
  .item{display:flex;flex-direction:column;gap:var(--space-2)}
  .chip{border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);font-size:var(--text-sm);
    font-weight:var(--weight-semibold);display:flex;align-items:center;gap:8px}
  .dot{width:10px;height:10px;border-radius:var(--radius-pill)}
  .solid{color:#fff;min-height:44px;border-radius:var(--radius-md);display:flex;align-items:center;
    padding:0 var(--space-3);font-weight:var(--weight-semibold)}
  .name{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
</style>
</head>
<body>
  <div class="item"><div class="solid" style="background:var(--success-600)">Sucesso</div>
    <div class="chip" style="background:var(--success-100);color:var(--green-700)"><span class="dot" style="background:var(--success-600)"></span>confirmado</div>
    <span class="name">--success-600</span></div>
  <div class="item"><div class="solid" style="background:var(--warning-600);color:var(--ink-900)">Atenção</div>
    <div class="chip" style="background:var(--warning-100);color:var(--amber-700)"><span class="dot" style="background:var(--warning-600)"></span>revisar</div>
    <span class="name">--warning-600</span></div>
  <div class="item"><div class="solid" style="background:var(--danger-600)">Erro</div>
    <div class="chip" style="background:var(--danger-100);color:var(--danger-600)"><span class="dot" style="background:var(--danger-600)"></span>reportado</div>
    <span class="name">--danger-600</span></div>
  <div class="item"><div class="solid" style="background:var(--info-600)">Info</div>
    <div class="chip" style="background:var(--info-100);color:var(--info-600)"><span class="dot" style="background:var(--info-600)"></span>aviso</div>
    <span class="name">--info-600</span></div>
</body>
</html>
